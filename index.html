    <style>

        .header {
            z-index: 10;
            background-color: #ffffff00;
            height: 70px;

            box-shadow: 0 0 0 rgba(0, 0, 0, 0);

        .header .div {
            /* background-color: aqua; */
            height: 70px;
            width: 95%;

        .header .div .left,
        .header .div .right {
            height: 70px;
            flex: 1;
            display: flex;
            align-items: center;

        .header .div .left {
            justify-content: flex-start;

        .header .div .right {
            justify-content: flex-end;
            gap: 10px;
        }

        .right {

            float: none;

        .bodyer {
            /* z-index: -2; */
            height: 100vh;
            width: 100vw;
            background-image: url(index/footage/background/3.jpg);
            /* 背景图垂直、水平均居中 */

            /* 背景图不平铺 */

            /* 当内容高度大于图片高度时，背景图像的位置相对于viewport固定 */
            background-attachment: fixed;
            /* 让背景图基于容器大小伸缩 */

            /* 设置背景颜色，背景图加载过程中会显示背景色 */
            background-color: #464646;
        }

        .center-content {
            /* z-index: -1; */

            justify-content: center;
            align-items: center;

            width: 100%;

            position: absolute;
            top: 0;

        }

<body>
    <!-- <video class="bg-video" autoplay loop muted width="100%" height="100%"> -->
    <!-- <source src="https://public.ysjf.com/mediastorm/banner/5294c11cb3ed6be81d6f855f42b0bfb8.webm" video/mp4"> -->
    <!-- </video> -->
    <div class="header" id="header">
        <div class="div">
            <nav class="left">
                <img src="./index/footage/1.png" alt="" height="50px">
                <div style="width: 10px;"></div>
                <p style="font-family: Lyon-Text, Georgia, ui-serif, serif;">
                    <strong>EYiCheng_的主页</strong>
                </p>
            </nav>
            <nav class="right">
                <a href="https://wyc-w.top" target="_blank">首页</a>
                <a href="https://github.com/wyc-e/wyc-w.top" target="_blank">网页开源</a>
                <a href="./index/历史版本/index.html" target="_blank">历史版本</a>

                <a href="./more/小游戏/index.html" target="_blank">小游戏</a>
                <a href="./more/index.html" target="_blank">更多</a>

        </div>
    </div>
    <div class="bodyer">
        <div class="center-content">
            <p
                style="font: bold; color: #ffffff; font-size: xx-large; font-family: Lyon-Text, Georgia, ui-serif, serif;">
                <i><strong>- 無限進步 -</strong></i>
            </p>
        </div>

    <main class="main">
        <h1 style="font-size: 3em; ">我的博客节选</h1>
        <br>
        <div id="posts-list" class="posts-grid">
            <p>加载中...</p>
        </div>
    </main>

    <!-- 侧边栏：最新文章（保持不变） -->
    <aside class="sidebar">
        <section class="widget recent-posts">
            <h3>最新文章</h3>
            <ul id="recent-list"></ul>
        </section>
    </aside>

    <script>
        // 配置
        const MD_REPO = 'https://blog-data.wyc-w.top/'; // 替换为你的仓库
        const LIST_JSON = 'list.json';
        const INDEX_MD = 'index.md';

        let listCache = null; // 缓存 list.json

        // 启用 marked 插件（用于解析，但不渲染正文）
        if (typeof markedEmoji !== 'undefined') {
            marked.use(markedEmoji());
        }
        if (typeof markedFootnote !== 'undefined') {
            marked.use(markedFootnote());
        }

        // 解析 front-matter 并提取元数据
        function parseFrontMatter(text) {
            const metaRegex = /^---\s*\n([\s\S]*?)\n---/;
            const metaMatch = text.match(metaRegex);
            const meta = {
                title: '无标题',
                date: '未知日期',
                category: '未分类',
                summary: '暂无摘要'
            };
            if (metaMatch) {
                metaMatch[1].split('\n').forEach(line => {
                    const [key, ...rest] = line.split(':');
                    if (key && rest.length) {
                        const value = rest.join(':').trim();
                        if (['title', 'date', 'category', 'summary'].includes(key.trim())) {
                            meta[key.trim()] = value;
                        }
                    }
                });
            }
            return meta;
        }

        // 获取 Markdown 文件并提取元信息
        async function fetchPostMeta(path) {
            try {
                const res = await fetch(`${MD_REPO}/${path}`);
                if (!res.ok) throw new Error(`加载失败: ${path}`);
                const text = await res.text();
                return parseFrontMatter(text);
            } catch (e) {
                console.error(e);
                return {
                    title: '加载失败',
                    date: '—',
                    category: '—',
                    summary: '无法获取内容',
                    path: path
                };
            }
        }

        // 加载 list.json 并渲染主内容区 + 侧边栏
        async function loadAll() {
            try {
                // 加载 list.json
                if (!listCache) {
                    const res = await fetch(`${MD_REPO}/${LIST_JSON}`);
                    if (!res.ok) throw new Error('list.json 加载失败');
                    listCache = await res.json();
                }

                const posts = listCache.slice(0, 5); // 前5篇文章

                // 获取每篇文章的元信息
                const metas = await Promise.all(
                    posts.map(async (post) => {
                        const meta = await fetchPostMeta(post.path);
                        meta.path = post.path; // 保留路径用于链接
                        return meta;
                    })
                );

                // 渲染主内容区：文章摘要卡片
                renderPostsList(metas);

                // 渲染侧边栏：最新文章（仅显示标题列表）
                renderSidebar(listCache);

            } catch (e) {
                document.getElementById('posts-list').innerHTML =
                    `<div><h2>加载失败</h2><p>${e.message}</p></div>`;
                document.getElementById('recent-list').innerHTML = '<li>加载失败</li>';
            }
        }

        // 渲染主内容区：文章卡片列表
        function renderPostsList(metas) {
            const container = document.getElementById('posts-list');
            container.innerHTML = metas.map(meta => `
        <article class="post-card">
          <h1>${meta.title}</h1>
          <p><strong>日期：</strong>${meta.date}</p>
          <p><strong>分类：</strong>${meta.category}</p>
          <p><strong>摘要：</strong>${meta.summary}</p>
          <a href="https://blog.wyc-w.top/reader.html?page=${meta.path}" class="btn-read-more">阅读全文</a>
        </article>
      `).join('');
        }

        // 渲染侧边栏：最新文章（仅标题列表）
        function renderSidebar(list) {
            const recentHtml = list.slice(0, 5)
                .map(p => `<li><a href="./reader.html?page=${p.path}">${p.name}</a></li>`)
                .join('');
            document.getElementById('recent-list').innerHTML = recentHtml;
        }

        // 汉堡菜单逻辑
        function initHamburger() {
            const hamburger = document.querySelector('.hamburger');
            const navList = document.querySelector('.nav-list');
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navList.classList.toggle('active');
            });
        }

        // 页面初始化
        window.addEventListener('load', () => {
            loadAll();
            initHamburger();
            // 如果未来支持路由切换，可监听 popstate
            // window.addEventListener('popstate', loadAll);
        });

        let isThrottled = false;  // 节流标记
        function handleScroll() {
            if (!isThrottled) {
                const scrollPosition = window.scrollY || document.documentElement.scrollTop;
                console.log("当前滚动条位置: ", scrollPosition);
                if (scrollPosition > document.documentElement.clientHeight) {
                    document.getElementById('header').style.backgroundColor = '#ffffff';
                    // document.getElementById('header').style.boxShadow = ' 0 1px 20px rgba(0, 0, 0, 0.397)';
                } else {
                    document.getElementById('header').style.backgroundColor = '#ffffff00';
                    document.getElementById('header').style.boxShadow = ' 0 0 0 rgba(0, 0, 0, 0)';
                }
            }
            isThrottled = true;
            setTimeout(() => isThrottled = false, 100); // 100毫秒后允许下一次触发
        }

        // 重新绑定滚动事件
        window.addEventListener('scroll', handleScroll);
    </script>
</body>

</html>
